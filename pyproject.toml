[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cfg-mgr"
version = "1.0.0"
requires-python = ">=3.9"
authors = [
    {name = "Raghav Jindal", email = "raghavjindal1998@gmail.com"}
]
description = "Simple out-of-box configs"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["config", "cfg", "config file"]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
dotenv = ["python-dotenv>=1.0.0"]
all = ["cfg-mgr[yaml,dotenv]"]


docs = ["sphinx", "sphinxcontrib-napoleon", "furo"]
dev = [
    "cfg-mgr[all]",
    "cfg-mgr[docs]",
    "python-lsp-server",
    "flake8",
    "build"
]

[project.urls]
Repository = "https://github.com/raghavj98/cfgmgr"
Documentation = "https://raghavj98.github.io/cfgmgr/"
